[project]
name = "agent_lib"
version = "0.1.0"
description = "Shared library for Goku VPS agent profiles"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "referencing>=0.30",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agent_lib"]
